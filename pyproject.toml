[project]
name = "sh-notice-mcp"
version = "0.2.0"
description = "SH(서울주택도시개발공사) 모집공고를 내 조건과 대조해 요약하고, 확인한 일정만 캘린더에 넣는 비공식 MCP 서버"
readme = "README.md"
requires-python = ">=3.10"
license = "PolyForm-Noncommercial-1.0.0"
keywords = ["mcp", "claude", "sh", "청약", "서울주택도시공사"]
dependencies = [
    "mcp[cli]>=2.3,<3",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pydantic>=2.6",
    "pypdf>=5.0",
    "tomli>=2.0; python_version<'3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
agent = ["anthropic>=0.40"]
remote = ["uvicorn>=0.30"]

[project.scripts]
sh-notice-mcp = "sh_notice_mcp.server:main"
sh-notice-run = "sh_notice_mcp.cli:main"
sh-notice-agent = "sh_notice_mcp.agent:main"
sh-notice-remote = "sh_notice_mcp.remote:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sh_notice_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
