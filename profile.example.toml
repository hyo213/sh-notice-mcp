# 예시 프로필 (가상의 인물). 복사해서 ~/.sh-notice-mcp/profile.toml 로 쓰거나, 처음 실행 때 생기는 양식에 직접 적으세요.
# SH 공고 자격 판단용 '내 조건' 파일
# - 이 파일은 내 컴퓨터에만 있고, 이 프로그램은 외부로 보내지 않습니다.
#   (Claude가 자격을 판단할 때 대화 중에 읽습니다.)
# - 아는 항목만 앞의 '#'을 지우고 값을 적으세요. '#'이 붙은 항목은 '모름'으로 봅니다.
# - 주민등록번호 같은 식별정보는 적지 마세요. 금액 단위: 만원

[basic]
birth_date = "1995-03-01"   # 생년월일 (YYYY-MM-DD)
household_head = true   # 세대주 여부
homeless_household = true   # 무주택세대구성원 여부 (세대원 전원 무주택)
seoul_resident = true   # 현재 서울 거주
seoul_since = 2015   # 서울 전입 연도 (계속 거주한 경우)
household_size = 2   # 세대원 수 (본인 포함)
marital_status = "기혼"   # 미혼 / 예비신혼 / 기혼 / 한부모
marriage_date = "2023-05-20"   # 혼인신고일 (YYYY-MM-DD). 신혼부부 기간(보통 7년) 판단용
children = 0   # 자녀 수 (태아 포함 여부는 공고마다 다름)
# minor_children = 0   # 미성년 자녀 수
# recent_births = 0   # 2023-03-28 이후 출생 자녀(태아 포함) 수. 소득·자산 기준 가산 대상
# dependents = 0   # 부양가족 수 (본인 제외, 배우자·직계존비속 등. 공고 기준 확인)
# homeless_years = 0   # 무주택 기간 (년). 기산일은 공고마다 다름
first_home_buyer = true   # 세대원 모두 과거에 주택을 소유한 적 없음 (생애최초 특별공급)
# disability = true   # 세대원 중 장애인 있음
# vulnerable = true   # 사회취약계층 해당 (수급자·차상위 등)
# recent_jeonse_contract = true   # 최근 5년 이내 장기전세주택 임대차계약 이력 (감점 대상)

[income_assets]
monthly_household_income = 600   # 세대 합산 월평균 소득 (만원)
dual_income = true   # 맞벌이 여부 (맞벌이는 소득 기준이 완화되는 경우가 많음)
total_assets = 20000   # 총자산 (만원). 부동산+금융+자동차 등, 산정 방식은 공고마다 다름
car_value = 1500   # 자동차가액 (만원). 차가 없으면 0
available_cash = 10000   # 가용 현금 (만원). 대출 없이 계약금·잔금·보증금에 바로 쓸 수 있는 돈
income_tax_5y = true   # 5년 이상 소득세 납부 (생애최초 특별공급 요건)

[savings_account]
payments = 60   # 주택청약종합저축 납입 횟수
months = 60   # 가입 기간 (개월)
# recognized_amount = 0   # 납입 인정 금액 (만원)

[wishes]
regions = ["강동구", "송파구"]   # 희망 지역. 예: ["강동구", "강서구"]
area = "60㎡ 이하"   # 희망 면적. 예: "60㎡ 이하"

[watch]
sale = true   # 주택분양 모집공고를 볼지 (적지 않으면 true)
rent = true   # 주택임대 모집공고를 볼지 (적지 않으면 true)
rent_types = ["장기전세주택", "행복주택"]   # 주택임대 중 볼 공급유형. 비우면 전체. 가능: 국민공공임대주택, 장기전세주택, 매입임대주택, 장기안심주택, 희망하우징, 행복주택, 청년안심주택, 전세임대, 영구임대주택, 재개발임대주택, 두레주택, 사회주택, 도시형생활주택, 수요자맞춤형
# include_words = []   # 제목에 이 단어 중 하나라도 있는 공고만 (예: ["강동", "고덕"]). 비우면 전부
# exclude_words = []   # 제목에 이 단어가 있으면 제외 (예: ["잔여세대"])

[loan]
expected_rate_pct = 3.0   # 내 예상 대출 금리 (연 %, 예: 2.5). 있으면 비용표 기준 금리로 쓰고, 공고 범위(최저~최고)도 함께 보여줌

[memo]
# note = ""   # 기타 (예: "청년 특별공급 관심")
